<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panfitrión — Tickets de Entrega</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Barlow+Semi+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════
   VARIABLES
══════════════════════════════════════════ */
:root {
  --bg:       #121210;
  --surface:  #1a1a16;
  --surface2: #222220;
  --border:   #2c2c26;
  --gold:     #E3C691;
  --gold-dim: #8a7448;
  --text:     #ede8dc;
  --muted:    #68665e;
  --danger:   #b84a36;
  --mono:     'IBM Plex Mono', monospace;
  --ui:       'Barlow Semi Condensed', sans-serif;
  --r:        3px;
}

/* ══════════════════════════════════════════
   RESET
══════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: var(--ui);
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  line-height: 1.5;
}
input, select, button, textarea { font-family: inherit; font-size: inherit; }
button { cursor: pointer; }

input[type="text"],
input[type="number"],
select {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--r);
  color: var(--text);
  font-family: var(--mono);
  font-size: 12px;
  padding: 7px 10px;
  outline: none;
  transition: border-color .15s;
  width: 100%;
}
input[type="text"]:focus,
input[type="number"]:focus,
select:focus { border-color: var(--gold); }
select option { background: var(--surface); }

/* ══════════════════════════════════════════
   HEADER
══════════════════════════════════════════ */
.hdr {
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  flex-shrink: 0;
}
.logo {
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 600;
  color: var(--gold);
  letter-spacing: .1em;
}
.logo span { color: var(--muted); font-weight: 400; }
.folio-chip {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--muted);
}

/* ══════════════════════════════════════════
   NAV
══════════════════════════════════════════ */
.nav {
  display: flex;
  height: 42px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  padding: 0 20px;
  flex-shrink: 0;
}
.tab {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: .08em;
  text-transform: uppercase;
  padding: 0 18px;
  cursor: pointer;
  border: none;
  border-bottom: 2px solid transparent;
  color: var(--muted);
  background: none;
  transition: color .15s, border-color .15s;
}
.tab:hover { color: var(--text); }
.tab.on  { color: var(--gold); border-bottom-color: var(--gold); }

/* ══════════════════════════════════════════
   BODY / SECTIONS
══════════════════════════════════════════ */
.body {
  height: calc(100vh - 94px); /* 52 header + 42 nav */
  display: flex;
  overflow: hidden;
}
.sec { display: none; width: 100%; height: 100%; }
.sec.on { display: flex; flex-direction: column; }
#s-cat.on { flex-direction: row; }

/* ══════════════════════════════════════════
   CATALOGO — SIDEBAR
══════════════════════════════════════════ */
.sidebar {
  width: 210px;
  flex-shrink: 0;
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.sidebar-top {
  padding: 13px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--muted);
  flex-shrink: 0;
}
.caf-list { flex: 1; overflow-y: auto; }
.caf-item {
  padding: 11px 16px;
  cursor: pointer;
  border-bottom: 1px solid var(--border);
  font-size: 14px;
  display: flex;
  align-items: center;
  border-left: 3px solid transparent;
  transition: background .1s;
}
.caf-item:hover { background: var(--surface2); }
.caf-item.on    { background: var(--surface2); border-left-color: var(--gold); }
.caf-item-name  { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ══════════════════════════════════════════
   CATALOGO — MAIN
══════════════════════════════════════════ */
.cat-main { flex: 1; overflow-y: auto; padding: 24px; }

/* ══════════════════════════════════════════
   CARDS
══════════════════════════════════════════ */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 20px;
  margin-bottom: 16px;
}
.card-head {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 16px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

/* ══════════════════════════════════════════
   SUCURSAL BLOCK
══════════════════════════════════════════ */
.suc-block {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 14px;
  margin-bottom: 10px;
}
.suc-block-head {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}
.suc-name-inp {
  flex: 1;
  background: none;
  border: none;
  border-bottom: 1px solid transparent;
  color: var(--text);
  font-family: var(--ui);
  font-size: 14px;
  font-weight: 600;
  outline: none;
  padding: 2px 0;
  transition: border-color .15s;
  width: 100%;
}
.suc-name-inp:hover,
.suc-name-inp:focus { border-bottom-color: var(--gold); }

.prods-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 6px;
  margin-top: 8px;
}
.prod-chk {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  cursor: pointer;
  line-height: 1.3;
}
.prod-chk input {
  width: 14px;
  height: 14px;
  accent-color: var(--gold);
  cursor: pointer;
  flex-shrink: 0;
}

/* ══════════════════════════════════════════
   TAG LIST (productos globales)
══════════════════════════════════════════ */
.tag-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.tag {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 2px;
  font-family: var(--mono);
  font-size: 11px;
}
.tag-x {
  cursor: pointer;
  color: var(--muted);
  background: none;
  border: none;
  font-size: 16px;
  padding: 0;
  line-height: 1;
}
.tag-x:hover { color: var(--danger); }

/* ══════════════════════════════════════════
   BUTTONS
══════════════════════════════════════════ */
.btn {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .06em;
  text-transform: uppercase;
  padding: 8px 16px;
  border-radius: var(--r);
  border: none;
  transition: opacity .15s, transform .1s;
  white-space: nowrap;
}
.btn:active { transform: scale(.97); }
.btn-gold   { background: var(--gold); color: #121210; }
.btn-gold:hover { opacity: .88; }
.btn-ghost  { background: transparent; border: 1px solid var(--border); color: var(--muted); }
.btn-ghost:hover { border-color: var(--text); color: var(--text); }
.btn-red    { background: transparent; border: 1px solid var(--danger); color: var(--danger); }
.btn-red:hover { background: var(--danger); color: #fff; }
.btn-sm  { padding: 5px 10px; font-size: 10px; }
.btn-icon{ padding: 4px 9px; font-size: 14px; }
.btn-lg  { padding: 12px 28px; font-size: 13px; }

/* ══════════════════════════════════════════
   ROW / STEP HEADER
══════════════════════════════════════════ */
.row {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-bottom: 10px;
}
.step-h {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 8px;
  margin-top: 20px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.step-h:first-child { margin-top: 0; }
.step-dot {
  width: 18px;
  height: 18px;
  background: var(--gold);
  color: #121210;
  border-radius: 50%;
  font-size: 9px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  font-weight: 700;
}
.ped-form .sel-grid {
  display: grid;
  gap: 10px;
  margin-top: 8px;
}
.ped-form .sel-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 12px 14px;
  cursor: pointer;
  transition: background .15s, border-color .15s, transform .1s;
}
.ped-form .sel-card:hover {
  background: var(--surface2);
}
.ped-form .sel-card.on {
  border-color: var(--gold);
  background: rgba(227,198,145,.12);
}
.ped-form .sel-card span {
  display: block;
  font-size: 14px;
  font-weight: 600;
}
.ped-form .sel-card small {
  display: block;
  margin-top: 4px;
  font-size: 11px;
  color: var(--muted);
}

/* ══════════════════════════════════════════
   PEDIDOS SECTION
══════════════════════════════════════════ */
.ped-wrap {
  display: grid;
  grid-template-columns: 1fr 300px;
  width: 100%;
  height: 100%;
  overflow: hidden;
}
.ped-form {
  padding: 24px;
  overflow-y: auto;
  border-right: 1px solid var(--border);
}
.order-summary {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 18px;
  margin-top: 18px;
}
.order-summary .row {
  gap: 16px;
  justify-content: space-between;
}
.modal {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,.45);
  z-index: 999;
  padding: 16px;
}
.modal.on {
  display: flex;
}
.modal-card {
  width: 100%;
  max-width: 560px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: calc(var(--r) * 1.5);
  box-shadow: 0 24px 60px rgba(0,0,0,.35);
  overflow: hidden;
}
.modal-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 18px 20px;
  border-bottom: 1px solid var(--border);
}
.modal-head div {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--gold);
}
.modal-body {
  padding: 18px 20px;
  max-height: 65vh;
  overflow-y: auto;
}
.modal-footer {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  padding: 16px 20px 20px;
  border-top: 1px solid var(--border);
}
.modal-body .sel-card {
  margin-bottom: 10px;
}
.modal-body .order-prod-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
}
.modal-body .order-prod-qty {
  width: 90px;
}
.modal-body .muted {
  margin-top: 8px;
}
.num-keypad {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
  margin-top: 18px;
}
.num-key {
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  padding: 16px 0;
  border-radius: var(--r);
  font-family: var(--mono);
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  transition: background .15s, border-color .15s, color .15s;
}
.num-key:hover {
  background: var(--surface2);
}
.num-key:active {
  transform: scale(.98);
}
.q-header {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.q-badge {
  background: var(--gold);
  color: #121210;
  font-size: 10px;
  font-weight: 700;
  padding: 1px 8px;
  border-radius: 10px;
}
.q-item {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 12px;
  margin-bottom: 8px;
}
.q-item-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 6px;
}
.q-item-name {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 600;
  color: var(--gold);
}
.q-item-sub {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--muted);
  margin-top: 2px;
}
.q-item-prods { font-size: 12px; color: var(--muted); }
.q-item-prods b { color: var(--text); }
.folio-sm {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--muted);
  background: var(--surface2);
  padding: 1px 6px;
  border-radius: 2px;
}
.order-prod-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 12px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--r);
  margin-bottom: 6px;
}
.order-prod-name { flex: 1; font-size: 14px; }
.order-prod-qty  { width: 64px; flex-shrink: 0; }

/* ══════════════════════════════════════════
   IMPRIMIR SECTION
══════════════════════════════════════════ */
.imp-wrap {
  display: grid;
  grid-template-columns: 1fr 220px;
  width: 100%;
  height: 100%;
  overflow: hidden;
}
.imp-preview {
  padding: 24px;
  overflow-y: auto;
}
.imp-actions {
  padding: 20px;
  border-left: 1px solid var(--border);
  background: var(--surface);
  display: flex;
  flex-direction: column;
  gap: 10px;
  overflow-y: auto;
}
.act-head {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 4px;
}
.preview-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
}
.preview-label {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--muted);
  text-align: center;
  margin-bottom: 6px;
}

/* ── Ticket preview (visual en pantalla) ── */
.preview-ticket {
  background: #fff;
  color: #000;
  font-family: 'Courier New', Courier, monospace;
  font-size: 8pt;
  line-height: 1.35;
  padding: 8px;
  width: 185px;
  box-shadow: 0 4px 20px rgba(0,0,0,.55);
}
.preview-ticket .t-hr  { border: none; border-top: 1px solid #000; margin: 3px 0; }
.preview-ticket .t-dhr { border: none; border-top: 1px dashed #999; margin: 3px 0; }
.preview-ticket .t-c   { text-align: center; }
.preview-ticket .t-b   { font-weight: bold; }
.preview-ticket table  { width: 100%; border-collapse: collapse; font-size: 8pt; }
.preview-ticket table td { padding: 1px 0; vertical-align: top; }
.preview-ticket .t-qty { text-align: right; width: 26px; white-space: nowrap; }
.preview-ticket .t-sp  { height: 5px; display: block; }

/* ══════════════════════════════════════════
   EMPTY STATE / MISC
══════════════════════════════════════════ */
.empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
  text-align: center;
  color: var(--muted);
}
.empty-ico { font-size: 28px; margin-bottom: 10px; opacity: .5; }
.empty-txt { font-family: var(--mono); font-size: 11px; line-height: 1.7; }
.muted { color: var(--muted); font-size: 12px; }
.mt { margin-top: 16px; }
.divider { border: none; border-top: 1px solid var(--border); margin: 6px 0; }

/* ══════════════════════════════════════════
   PRINT STYLES — 58mm
══════════════════════════════════════════ */
@media print {
  @page {
    size: 58mm auto;
    margin: 0;
  }

  /* ─── CRÍTICO: forzar el documento a 58mm de ancho ───────────────────
     Sin esto, el browser renderiza al ancho de la pantalla y escala todo
     hacia abajo para caber en 58mm, haciendo el texto minúsculo.
     Con esto, renderiza a 58mm 1:1 y los pt salen a su tamaño real.
  ──────────────────────────────────────────────────────────────────── */
  html {
    width: 58mm;
    height: auto;
    overflow: visible;
  }
  body {
    width: 58mm;
    min-width: 58mm;
    height: auto;
    overflow: visible;
    background: white;
    margin: 0;
    padding: 0;
  }

  /* Ocultar toda la UI */
  .no-print { display: none !important; }

  /* Mostrar área de impresión */
  #print-area {
    display: block !important;
    width: 58mm;
    box-sizing: border-box;
    padding: 0;
  }

  /* Cada ticket — page-break = corte del autocutter */
  .print-ticket {
    width: 100%;
    font-family: 'Courier New', Courier, monospace;
    font-size: 14pt;
    font-weight: bold;
    line-height: 1.5;
    color: #000;
    background: white;
    page-break-after: always;
    page-break-inside: avoid;
  }
  .print-ticket:last-child {
    page-break-after: avoid;
  }

  /* Tipografía */
  .p-c { text-align: center; }
  .p-b { font-weight: bold; }

  /* Líneas */
  .p-hr  { border: none; border-top: 2px solid #000; margin: 4px 0; display: block; }
  .p-dhr { border: none; border-top: 1px dashed #333; margin: 4px 0; display: block; }

  /* Tabla de productos */
  .p-table { width: 100%; border-collapse: collapse; }
  .p-table td { padding: 2px 0; font-size: 14pt; vertical-align: top; }
  .p-td-n { text-align: left; }
  .p-td-q { text-align: right; width: 20px; white-space: nowrap; }

  /* Espaciado */
  .p-sp { height: 5mm; display: block; }
}
</style>
</head>
<body>

<!-- ══════════════════════════════════════
     UI (se oculta al imprimir)
══════════════════════════════════════════ -->
<div class="no-print" style="height:100%;display:flex;flex-direction:column;">

  <!-- Header -->
  <header class="hdr">
    <div class="logo">Panfitrión <span>/ Tickets de Entrega</span></div>
    <div class="folio-chip" id="folio-display"></div>
  </header>

  <!-- Nav -->
  <nav class="nav">
    <button class="tab on"  onclick="showSec('cat',this)">Catálogo</button>
    <button class="tab"     onclick="showSec('ped',this)">Pedidos</button>
    <button class="tab"     onclick="showSec('imp',this)">Imprimir</button>
  </nav>

  <div class="body">

    <!-- ══════════════════════════════════
         SECCIÓN: CATÁLOGO
    ══════════════════════════════════════ -->
    <section id="s-cat" class="sec on">

      <!-- Sidebar: lista de cafeterías -->
      <div class="sidebar">
        <div class="sidebar-top">
          Cafeterías
          <button class="btn btn-gold btn-icon" onclick="addCaf()" title="Nueva cafetería">+</button>
        </div>
        <div class="caf-list" id="caf-list"></div>
      </div>

      <!-- Main: detalle -->
      <div class="cat-main" id="cat-main">
        <div class="empty">
          <div class="empty-ico">🏪</div>
          <div class="empty-txt">Selecciona una cafetería<br>para ver y editar sus datos</div>
        </div>
      </div>

    </section>

    <!-- ══════════════════════════════════
         SECCIÓN: PEDIDOS
    ══════════════════════════════════════ -->
    <section id="s-ped" class="sec">
      <div class="ped-wrap">

        <!-- Formulario de captura -->
        <div class="ped-form">

          <div class="step-h"><span class="step-dot">1</span> Pedido</div>
          <div class="order-start">
            <div class="muted">
              Inicia un pedido con modales. Selecciona cafetería, sucursal y cantidades paso a paso.
            </div>
            <div class="mt">
              <button class="btn btn-gold" onclick="openOrderModal()">Nuevo pedido</button>
            </div>
          </div>

          <div id="order-summary"></div>

          <div id="order-modal" class="modal" onclick="if(event.target===this) closeOrderModal()">
            <div class="modal-card">
              <div class="modal-head">
                <div id="modal-title"></div>
                <button class="btn btn-icon btn-red" onclick="closeOrderModal()">×</button>
              </div>
              <div id="modal-body" class="modal-body"></div>
              <div class="modal-footer">
                <button class="btn btn-ghost" onclick="closeOrderModal()">Cancelar</button>
                <button class="btn btn-ghost" id="modal-back-btn" onclick="modalBack()" style="display:none;">Atrás</button>
                <button class="btn btn-gold" id="modal-primary-btn" onclick="modalPrimaryAction()" style="display:none;">Continuar</button>
              </div>
            </div>
          </div>

        </div>

        <!-- Cola de pedidos -->
        <div class="ped-queue">
          <div class="q-header">
            Tirada actual
            <span class="q-badge" id="q-count">0</span>
          </div>
          <div id="q-list"></div>
        </div>

      </div>
    </section>

    <!-- ══════════════════════════════════
         SECCIÓN: IMPRIMIR
    ══════════════════════════════════════ -->
    <section id="s-imp" class="sec">
      <div class="imp-wrap">

        <!-- Previews de tickets -->
        <div class="imp-preview">
          <div class="preview-grid" id="preview-grid"></div>
        </div>

        <!-- Panel de acciones -->
        <div class="imp-actions">
          <div class="act-head">Acciones</div>
          <button class="btn btn-gold btn-lg" onclick="doPrint()">🖨 Imprimir todo</button>
          <button class="btn btn-ghost" onclick="clearQueue()">Limpiar tirada</button>
          <hr class="divider">
          <div class="muted" style="line-height:1.8;">
            Cada ticket:<br>
            <b style="color:var(--gold);">2 copias</b><br>
            Papel: <b style="color:var(--gold);">58 mm</b><br>
            Sin precios
          </div>
        </div>

      </div>
    </section>

  </div>
</div>

<!-- ══════════════════════════════════════
     ÁREA DE IMPRESIÓN (oculta en pantalla,
     visible al imprimir vía @media print)
══════════════════════════════════════════ -->
<div id="print-area" style="display:none;"></div>


<script>
// ════════════════════════════════════════════
// BASE DE DATOS (localStorage)
// ════════════════════════════════════════════
let DB = {
  productos:  [],  // [{ id, nombre }]
  cafeterias: []   // [{ id, nombre, sucursales: [{ id, nombre, pids: [] }] }]
};
let folio = 0;

// Cola de la sesión actual (no se guarda en localStorage)
let queue = []; // [{ id, folio, cafId, sucId, fecha, items: [{ pid, qty }] }]

// ID de la cafetería activa en el catálogo
let activeCafId = null;

// Estado de selección de pedidos
let pedCafId = '';
let pedSucId = '';
let orderStep = 0;
let currentQtyPid = '';

// ════════════════════════════════════════════
// PERSISTENCIA
// ════════════════════════════════════════════
const LS_DB    = 'panfitron_tk_db';
const LS_FOLIO = 'panfitron_tk_folio';

function load() {
  try {
    const d = localStorage.getItem(LS_DB);
    if (d) DB = JSON.parse(d);
  } catch(e) { console.warn('Error cargando DB', e); }
  folio = parseInt(localStorage.getItem(LS_FOLIO) || '0') || 0;
}

function save() {
  localStorage.setItem(LS_DB, JSON.stringify(DB));
  localStorage.setItem(LS_FOLIO, String(folio));
}

// ════════════════════════════════════════════
// UTILIDADES
// ════════════════════════════════════════════
function uid() {
  return Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
}

// Incrementa folio, guarda y devuelve string con ceros
function nFolio() {
  folio++;
  save();
  return String(folio).padStart(4, '0');
}

// Fecha de hoy como DD/MM/YYYY
function hoy() {
  const d  = new Date();
  const dd = String(d.getDate()).padStart(2, '0');
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  return `${dd}/${mm}/${d.getFullYear()}`;
}

// Escape HTML
function h(s) {
  if (!s) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// Lookups
function getCaf(id)         { return DB.cafeterias.find(c => c.id === id); }
function getSuc(cafId, sucId) {
  const c = getCaf(cafId);
  return c ? c.sucursales.find(s => s.id === sucId) : null;
}
function getProd(id)        { return DB.productos.find(p => p.id === id); }

// ════════════════════════════════════════════
// NAVEGACIÓN
// ════════════════════════════════════════════
function showSec(name, el) {
  document.querySelectorAll('.sec').forEach(s => s.classList.remove('on'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('on'));
  document.getElementById('s-' + name).classList.add('on');
  el.classList.add('on');
  if (name === 'ped') renderPedSelects();
  if (name === 'imp') renderPreview();
}

// ════════════════════════════════════════════
// CATÁLOGO — PRODUCTOS GLOBALES
// ════════════════════════════════════════════
function addProdGlobal() {
  const inp = document.getElementById('inp-prod');
  const n   = inp.value.trim();
  if (!n) return;
  DB.productos.push({ id: uid(), nombre: n });
  inp.value = '';
  save();
  renderCatMain();
}

function delProd(pid) {
  if (!confirm('¿Eliminar este producto? Se quitará de todas las sucursales.')) return;
  DB.productos = DB.productos.filter(p => p.id !== pid);
  // Limpiar de todas las sucursales
  DB.cafeterias.forEach(c =>
    c.sucursales.forEach(s => {
      s.pids = s.pids.filter(id => id !== pid);
    })
  );
  save();
  renderCatMain();
}

// ════════════════════════════════════════════
// CATÁLOGO — CAFETERÍAS
// ════════════════════════════════════════════
function addCaf() {
  const n = prompt('Nombre de la cafetería:');
  if (!n || !n.trim()) return;
  const c = { id: uid(), nombre: n.trim(), sucursales: [] };
  DB.cafeterias.push(c);
  save();
  renderCafList();
  selCaf(c.id);
}

function delCaf(id) {
  if (!confirm('¿Eliminar esta cafetería y todas sus sucursales?')) return;
  DB.cafeterias = DB.cafeterias.filter(c => c.id !== id);
  if (activeCafId === id) activeCafId = null;
  save();
  renderCafList();
  document.getElementById('cat-main').innerHTML = `
    <div class="empty">
      <div class="empty-ico">←</div>
      <div class="empty-txt">Selecciona una cafetería para editar</div>
    </div>`;
}

function selCaf(id) {
  activeCafId = id;
  renderCafList();
  renderCatMain();
}

function renameCaf(id, v) {
  const c = getCaf(id);
  if (c && v.trim()) { c.nombre = v.trim(); save(); renderCafList(); }
}

// ════════════════════════════════════════════
// CATÁLOGO — SUCURSALES
// ════════════════════════════════════════════
function addSuc(cafId) {
  const n = prompt('Nombre de la sucursal:');
  if (!n || !n.trim()) return;
  const c = getCaf(cafId);
  if (!c) return;
  c.sucursales.push({ id: uid(), nombre: n.trim(), pids: [] });
  save();
  renderCatMain();
}

function delSuc(cafId, sucId) {
  if (!confirm('¿Eliminar esta sucursal?')) return;
  const c = getCaf(cafId);
  if (!c) return;
  c.sucursales = c.sucursales.filter(s => s.id !== sucId);
  save();
  renderCatMain();
}

function renameSuc(cafId, sucId, v) {
  const s = getSuc(cafId, sucId);
  if (s && v.trim()) { s.nombre = v.trim(); save(); }
}

function toggleProd(cafId, sucId, pid, checked) {
  const s = getSuc(cafId, sucId);
  if (!s) return;
  if (checked && !s.pids.includes(pid)) s.pids.push(pid);
  else if (!checked) s.pids = s.pids.filter(id => id !== pid);
  save();
}

// ════════════════════════════════════════════
// RENDER — SIDEBAR CAFETERÍAS
// ════════════════════════════════════════════
function renderCafList() {
  const el = document.getElementById('caf-list');
  if (!DB.cafeterias.length) {
    el.innerHTML = `<div class="empty" style="padding:20px 12px;">
      <div class="empty-txt">Sin cafeterías.<br>Usa + para agregar.</div>
    </div>`;
    return;
  }
  el.innerHTML = DB.cafeterias.map(c => `
    <div class="caf-item ${c.id === activeCafId ? 'on' : ''}"
         onclick="selCaf('${c.id}')">
      <span class="caf-item-name">${h(c.nombre)}</span>
    </div>
  `).join('');
}

// ════════════════════════════════════════════
// RENDER — CATÁLOGO MAIN
// ════════════════════════════════════════════
function renderCatMain() {
  const el  = document.getElementById('cat-main');
  const caf = getCaf(activeCafId);

  // Tarjeta de productos globales (siempre visible)
  let html = `
    <div class="card">
      <div class="card-head">📦 Catálogo de productos</div>
      <div class="row">
        <input type="text" id="inp-prod"
               placeholder="Nombre del producto..."
               onkeydown="if(event.key==='Enter') addProdGlobal()"
               style="flex:1;">
        <button class="btn btn-gold" onclick="addProdGlobal()">Agregar</button>
      </div>
      <div class="tag-list">
        ${DB.productos.map(p => `
          <div class="tag">
            ${h(p.nombre)}
            <button class="tag-x" onclick="delProd('${p.id}')" title="Eliminar">×</button>
          </div>
        `).join('')}
      </div>
      ${!DB.productos.length
        ? `<div class="muted" style="margin-top:8px;">Sin productos aún. Agrega uno arriba.</div>`
        : ''}
    </div>
  `;

  // Si no hay cafetería seleccionada, solo mostrar los productos
  if (!caf) {
    html += `<div class="empty">
      <div class="empty-ico">←</div>
      <div class="empty-txt">Selecciona una cafetería para editar<br>sus sucursales y productos asignados</div>
    </div>`;
    el.innerHTML = html;
    return;
  }

  // Tarjeta de la cafetería seleccionada
  html += `
    <div class="card">
      <div class="card-head">
        🏪 Cafetería seleccionada
        <button class="btn btn-red btn-sm" onclick="delCaf('${caf.id}')">Eliminar</button>
      </div>

      <!-- Nombre editable -->
      <div class="row" style="margin-bottom:20px;">
        <input type="text"
               value="${h(caf.nombre)}"
               placeholder="Nombre de la cafetería"
               onchange="renameCaf('${caf.id}', this.value)"
               style="flex:1; font-size:14px;">
      </div>

      <!-- Sucursales -->
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
        <div class="step-h" style="margin:0;">
          <span class="step-dot" style="background:var(--gold-dim);">S</span> Sucursales
        </div>
        <button class="btn btn-ghost btn-sm" onclick="addSuc('${caf.id}')">+ Agregar sucursal</button>
      </div>

      ${!caf.sucursales.length
        ? `<div class="muted">Sin sucursales. Agrega una con el botón de arriba.</div>`
        : ''}

      ${caf.sucursales.map(suc => `
        <div class="suc-block">
          <div class="suc-block-head">
            <input type="text"
                   value="${h(suc.nombre)}"
                   class="suc-name-inp"
                   onchange="renameSuc('${caf.id}','${suc.id}',this.value)">
            <button class="btn btn-red btn-icon"
                    onclick="delSuc('${caf.id}','${suc.id}')"
                    title="Eliminar sucursal">×</button>
          </div>

          <div class="muted" style="font-size:11px;margin-bottom:6px;">
            Productos asignados a esta sucursal:
          </div>

          ${!DB.productos.length
            ? `<div class="muted" style="font-size:11px;">
                Primero agrega productos en el catálogo de arriba.
               </div>`
            : `<div class="prods-grid">
                ${DB.productos.map(p => `
                  <label class="prod-chk">
                    <input type="checkbox"
                           ${suc.pids.includes(p.id) ? 'checked' : ''}
                           onchange="toggleProd('${caf.id}','${suc.id}','${p.id}',this.checked)">
                    ${h(p.nombre)}
                  </label>
                `).join('')}
               </div>`
          }
        </div>
      `).join('')}
    </div>
  `;

  el.innerHTML = html;
}

// ════════════════════════════════════════════
// RENDER — PEDIDOS: CONTROL VISUAL
// ════════════════════════════════════════════
function renderPedSelects() {
  renderOrderSummary();
}

function renderOrderSummary() {
  const el = document.getElementById('order-summary');
  const caf = getCaf(pedCafId);
  const suc = getSuc(pedCafId, pedSucId);

  el.innerHTML = `
    <div class="order-summary">
      <div class="row">
        <div>
          <div class="muted">Cafetería</div>
          <div>${caf ? h(caf.nombre) : '<em>No seleccionada</em>'}</div>
        </div>
        <div>
          <div class="muted">Sucursal</div>
          <div>${suc ? h(suc.nombre) : '<em>No seleccionada</em>'}</div>
        </div>
      </div>
      <div class="muted" style="margin-top:12px;">
        El pedido se crea desde el modal. Presiona <strong>Nuevo pedido</strong> para comenzar.
      </div>
    </div>
  `;
}

function openOrderModal() {
  pedCafId = '';
  pedSucId = '';
  currentQtyPid = '';
  orderStep = 1;
  document.getElementById('order-modal').classList.add('on');
  renderOrderModal();
}

function closeOrderModal() {
  pedCafId = '';
  pedSucId = '';
  currentQtyPid = '';
  orderStep = 0;
  document.getElementById('order-modal').classList.remove('on');
  renderOrderSummary();
}

function modalBack() {
  if (orderStep === 3) {
    orderStep = 2;
  } else if (orderStep === 2) {
    orderStep = 1;
  }
  renderOrderModal();
}

function modalPrimaryAction() {
  if (orderStep === 3) {
    addToQueue();
  }
}

function renderOrderModal() {
  const title = document.getElementById('modal-title');
  const body = document.getElementById('modal-body');
  const primaryBtn = document.getElementById('modal-primary-btn');
  const backBtn = document.getElementById('modal-back-btn');
  const caf = getCaf(pedCafId);

  if (orderStep === 1) {
    title.textContent = 'Selecciona una cafetería';
    backBtn.style.display = 'none';
    primaryBtn.style.display = 'none';
    body.innerHTML = DB.cafeterias.length
      ? DB.cafeterias.map(c => `
          <div class="sel-card ${c.id === pedCafId ? 'on' : ''}"
               onclick="modalSelectCaf('${c.id}')">
            <span>${h(c.nombre)}</span>
            <small>Toca para elegir</small>
          </div>
        `).join('')
      : `<div class="empty" style="padding:20px;">
           <div class="empty-txt">No hay cafeterías. Crea una en Catálogo.</div>
         </div>`;
    return;
  }

  if (orderStep === 2) {
    title.textContent = 'Selecciona una sucursal';
    backBtn.style.display = 'inline-flex';
    primaryBtn.style.display = 'none';
    body.innerHTML = caf
      ? caf.sucursales.length
        ? caf.sucursales.map(s => `
            <div class="sel-card ${s.id === pedSucId ? 'on' : ''}"
                 onclick="modalSelectSuc('${s.id}')">
              <span>${h(s.nombre)}</span>
              <small>Toca para elegir</small>
            </div>
          `).join('')
        : `<div class="empty" style="padding:20px;">
             <div class="empty-txt">Esta cafetería no tiene sucursales. Agrégalas en Catálogo.</div>
           </div>`
      : `<div class="muted">Selecciona primero una cafetería.</div>`;
    return;
  }

  title.textContent = 'Ingresa cantidades';
  backBtn.style.display = 'inline-flex';
  primaryBtn.style.display = 'inline-flex';
  primaryBtn.textContent = 'Agregar pedido';
  const suc = getSuc(pedCafId, pedSucId);

  if (!suc || !suc.pids.length) {
    body.innerHTML = `<div class="empty" style="padding:20px;">
      <div class="empty-txt">No hay productos asignados a esta sucursal.</div>
    </div>`;
    primaryBtn.style.display = 'none';
    return;
  }

  body.innerHTML = suc.pids.map(pid => {
    const p = getProd(pid);
    if (!p) return '';
    return `
      <div class="order-prod-row">
        <span class="order-prod-name">${h(p.nombre)}</span>
        <input type="text" class="order-prod-qty"
               inputmode="numeric" pattern="[0-9]*"
               value="" placeholder="0"
               data-pid="${pid}"
               onfocus="setCurrentQtyInput(this)">
      </div>
    `;
  }).join('') + renderNumericKeypad();
}

function setCurrentQtyInput(el) {
  currentQtyPid = el.dataset.pid || '';
}

function handleKeypadPress(key) {
  const inputs = document.querySelectorAll('#modal-body input[data-pid]');
  if (!inputs.length) return;

  let input = currentQtyPid
    ? document.querySelector(`#modal-body input[data-pid="${currentQtyPid}"]`)
    : inputs[0];

  if (!input) input = inputs[0];

  if (key === 'back') {
    input.value = input.value.slice(0, -1);
  } else if (key === 'clear') {
    input.value = '';
  } else {
    input.value = `${input.value || ''}${key}`;
  }

  currentQtyPid = input.dataset.pid;
  input.focus();
}

function renderNumericKeypad() {
  return `
    <div class="num-keypad">
      ${['1','2','3','4','5','6','7','8','9','clear','0','back'].map(key => `
        <button type="button" class="num-key" onclick="handleKeypadPress('${key}')">
          ${key === 'back' ? '⌫' : key === 'clear' ? 'C' : key}
        </button>
      `).join('')}
    </div>
  `;
}

function modalSelectCaf(cafId) {
  pedCafId = cafId;
  orderStep = 2;
  renderOrderModal();
}

function modalSelectSuc(sucId) {
  pedSucId = sucId;
  orderStep = 3;
  renderOrderModal();
}

// ════════════════════════════════════════════
// QUEUE — AGREGAR PEDIDO
// ════════════════════════════════════════════
function addToQueue() {
  const cafId = pedCafId;
  const sucId = pedSucId;

  if (!cafId || !sucId) {
    alert('Selecciona cafetería y sucursal.');
    return;
  }

  const inputs = document.querySelectorAll('#modal-body input[data-pid]');
  const items  = [];

  inputs.forEach(inp => {
    const qty = parseInt(inp.value) || 0;
    if (qty > 0) items.push({ pid: inp.dataset.pid, qty });
  });

  if (!items.length) {
    alert('Ingresa al menos una cantidad mayor a 0.');
    return;
  }

  const f = nFolio();
  queue.push({ id: uid(), folio: f, cafId, sucId, fecha: hoy(), items });

  inputs.forEach(inp => inp.value = '');

  renderQueue();
  updateFolioDisplay();
  renderOrderSummary();
  closeOrderModal();
}

function removeFromQueue(id) {
  queue = queue.filter(q => q.id !== id);
  renderQueue();
}

// ════════════════════════════════════════════
// RENDER — COLA DE PEDIDOS
// ════════════════════════════════════════════
function renderQueue() {
  const list  = document.getElementById('q-list');
  const badge = document.getElementById('q-count');
  badge.textContent = queue.length;

  if (!queue.length) {
    list.innerHTML = `<div class="empty">
      <div class="empty-ico">🧾</div>
      <div class="empty-txt">Sin pedidos en la tirada</div>
    </div>`;
    return;
  }

  list.innerHTML = queue.map(q => {
    const caf  = getCaf(q.cafId);
    const suc  = getSuc(q.cafId, q.sucId);
    const rows = q.items.map(it => {
      const p = getProd(it.pid);
      return `<b>${p ? h(p.nombre) : '?'}</b>&nbsp;×${it.qty}`;
    }).join(' &nbsp;·&nbsp; ');

    return `
      <div class="q-item">
        <div class="q-item-top">
          <div>
            <div class="q-item-name">${caf ? h(caf.nombre) : '?'}</div>
            <div class="q-item-sub">${suc ? h(suc.nombre) : '?'} · ${q.fecha}</div>
          </div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;">
            <span class="folio-sm">#${q.folio}</span>
            <button class="btn btn-red btn-icon"
                    onclick="removeFromQueue('${q.id}')">×</button>
          </div>
        </div>
        <div class="q-item-prods">${rows}</div>
      </div>
    `;
  }).join('');
}

// ════════════════════════════════════════════
// RENDER — PREVIEW DE TICKETS
// ════════════════════════════════════════════
function renderPreview() {
  const grid = document.getElementById('preview-grid');

  if (!queue.length) {
    grid.innerHTML = `<div class="empty" style="width:100%;">
      <div class="empty-ico">🖨️</div>
      <div class="empty-txt">Sin tickets en la tirada.<br>Agrega pedidos en la sección Pedidos.</div>
    </div>`;
    return;
  }

  grid.innerHTML = queue.map(q => {
    const caf = getCaf(q.cafId);
    return `
      <div>
        <div class="preview-label">#${q.folio} — ${caf ? h(caf.nombre) : '?'}</div>
        <div class="preview-ticket">${ticketHtml(q, true)}</div>
      </div>
    `;
  }).join('');
}

// ════════════════════════════════════════════
// TICKET HTML (preview en pantalla / print)
// ════════════════════════════════════════════
function ticketHtml(q, isPreview) {
  const caf = getCaf(q.cafId);
  const suc = getSuc(q.cafId, q.sucId);
  const cn  = caf ? caf.nombre : '?';
  const sn  = suc ? suc.nombre : '?';

  // Truncar nombres para que quepan en el ancho del ticket
  // A 11pt en ~44mm de contenido: ~16 chars por línea
  function trunc(s, max) {
    return s.length > max ? s.substring(0, max - 1) + '…' : s;
  }

  if (isPreview) {
    const rows = q.items.map(it => {
      const p = getProd(it.pid);
      const n = p ? p.nombre : '?';
      return `<tr>
        <td>${h(trunc(n, 22))}</td>
        <td class="t-qty">${it.qty}</td>
      </tr>`;
    }).join('');

    return `
      <div class="t-c t-b">PANFITRIÓN</div>
      <div class="t-c">ORDEN DE ENTREGA</div>
      <hr class="t-hr">
      <div>Folio: #${q.folio}</div>
      <div>Fecha: ${q.fecha}</div>
      <hr class="t-dhr">
      <div class="t-b">${h(trunc(cn, 22))}</div>
      <div>${h(trunc(sn, 22))}</div>
      <hr class="t-dhr">
      <table>
        <thead>
          <tr>
            <td class="t-b">PRODUCTO</td>
            <td class="t-qty t-b">CNT</td>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
      <hr class="t-hr">
      <span class="t-sp"></span>
      <div>Firma: ______________</div>
      <span class="t-sp"></span>
    `;
  } else {
    const rows = q.items.map(it => {
      const p = getProd(it.pid);
      const n = p ? p.nombre : '?';
      return `<tr>
        <td class="p-td-n">${h(trunc(n, 16))}</td>
        <td class="p-td-q">${it.qty}</td>
      </tr>`;
    }).join('');

    return `
      <div class="p-c p-b">PANFITRION</div>
      <div class="p-c p-b">ORDEN DE ENTREGA</div>
      <hr class="p-hr">
      <div>Folio: #${q.folio}</div>
      <div>Fecha: ${q.fecha}</div>
      <hr class="p-dhr">
      <div class="p-b">${h(trunc(cn, 18))}</div>
      <div class="p-b">${h(trunc(sn, 18))}</div>
      <hr class="p-dhr">
      <table class="p-table">
        <thead>
          <tr>
            <td class="p-td-n p-b">PRODUCTO</td>
            <td class="p-td-q p-b">CNT</td>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
      <hr class="p-hr">
      <span class="p-sp"></span>
      <div>Firma: ___________</div>
      <span class="p-sp"></span>
    `;
  }
}

// ════════════════════════════════════════════
// IMPRIMIR
// ════════════════════════════════════════════
function doPrint() {
  if (!queue.length) {
    alert('No hay tickets en la tirada.');
    return;
  }

  const area = document.getElementById('print-area');
  let html   = '';

  // 2 copias por ticket, cada una en su propia "hoja" (corte térmico)
  queue.forEach(q => {
    html += `<div class="print-ticket">${ticketHtml(q, false)}</div>`;
    html += `<div class="print-ticket">${ticketHtml(q, false)}</div>`;
  });

  area.innerHTML = html;

  // Pequeño delay para asegurar que el DOM se actualice antes de imprimir
  setTimeout(() => window.print(), 150);
}

function clearQueue() {
  if (queue.length && !confirm('¿Limpiar toda la tirada actual?')) return;
  queue = [];
  renderQueue();
  renderPreview();
}

// ════════════════════════════════════════════
// FOLIO DISPLAY
// ════════════════════════════════════════════
function updateFolioDisplay() {
  const chip = document.getElementById('folio-display');
  chip.textContent = folio > 0
    ? `Último folio: #${String(folio).padStart(4, '0')}`
    : '';
}

// ════════════════════════════════════════════
// INICIALIZAR
// ════════════════════════════════════════════
load();
renderCafList();
renderCatMain();
renderQueue();
updateFolioDisplay();
</script>
</body>
